<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Müzik</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=Germania+One&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../apps.css" />
    <style>
      .music-shell {
        max-width: 980px;
        margin: 0 auto;
        display: grid;
        gap: 24px;
        width: 100%;
      }
      .music-card {
        background: rgba(15, 12, 26, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 28px;
        display: grid;
        gap: 18px;
      }
      .music-header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }
      .music-header h1 {
        margin: 0;
        font-size: 42px;
      }
      .music-controls {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .music-controls button,
      .music-controls input {
        padding: 14px 18px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
        font-family: Geist Pixel;
        cursor: pointer;
      }
      .music-connect {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .music-status {
        color: #c4bef8;
        line-height: 1.8;
      }
      .track-list {
        display: grid;
        gap: 14px;
      }
      .track-item {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
      }
      .track-item strong {
        display: block;
        color: #fff;
      }
      .track-item small {
        color: #b5b0f8;
      }
      .track-item button {
        padding: 10px 14px;
        border-radius: 14px;
      }
    </style>
  </head>
  <body>
    <div class="bg-fx" aria-hidden="true">
      <div class="bg-blob blob-1"></div>
      <div class="bg-blob blob-2"></div>
      <div class="bg-blob blob-3"></div>
      <div class="bg-blob blob-4"></div>
      <div class="bg-grid"></div>
    </div>
    <a href="../../../bros.html" class="back-button">BrOS</a>
    <div class="placeholder-shell music-shell">
      <article class="music-card">
        <div class="music-header">
          <div>
            <p class="placeholder-subtitle">Spotify bağlantısı</p>
            <h1>Muzik</h1>
          </div>
          <button id="logout-btn" type="button">Çıkış Yap</button>
        </div>
        <div class="music-connect">
          <button id="connect-btn" type="button">Spotify'a Bağlan</button>
          <p class="music-status" id="music-status">Spotify bağlantısı için butona tıklayın.</p>
        </div>
        <section class="track-list" id="track-list" aria-live="polite"></section>
      </article>
    </div>
    <script>
      const CLIENT_ID = 'REPLACE_WITH_YOUR_SPOTIFY_CLIENT_ID';
      const SCOPES = 'user-read-private user-top-read';
      const REDIRECT_URI = window.location.origin + window.location.pathname;
      const connectBtn = document.getElementById('connect-btn');
      const logoutBtn = document.getElementById('logout-btn');
      const statusText = document.getElementById('music-status');
      const trackList = document.getElementById('track-list');
      const TOKEN_KEY = 'bros-spotify-token';

      function getHashParams() {
        return window.location.hash
          .substring(1)
          .split('&')
          .reduce((acc, pair) => {
            const [key, value] = pair.split('=');
            if (key) acc[key] = decodeURIComponent(value);
            return acc;
          }, {});
      }

      function saveToken(token) {
        sessionStorage.setItem(TOKEN_KEY, token);
      }

      function getToken() {
        return sessionStorage.getItem(TOKEN_KEY);
      }

      function clearToken() {
        sessionStorage.removeItem(TOKEN_KEY);
      }

      function buildAuthUrl() {
        const params = new URLSearchParams({
          client_id: CLIENT_ID,
          response_type: 'token',
          redirect_uri: REDIRECT_URI,
          scope: SCOPES,
          show_dialog: 'true',
        });
        return `https://accounts.spotify.com/authorize?${params}`;
      }

      async function fetchSpotify(path) {
        const token = getToken();
        if (!token) throw new Error('Token yok');
        const response = await fetch(`https://api.spotify.com/v1/${path}`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!response.ok) {
          throw new Error(`Spotify API hata: ${response.status}`);
        }
        return response.json();
      }

      function renderTracks(tracks) {
        trackList.innerHTML = '';
        if (!tracks.length) {
          trackList.innerHTML = '<p>Top tracks yüklenemiyor veya boş.</p>';
          return;
        }
        tracks.forEach((track) => {
          const item = document.createElement('article');
          item.className = 'track-item';
          item.innerHTML = `
            <div>
              <strong>${track.name}</strong>
              <small>${track.artists.map((artist) => artist.name).join(', ')}</small>
            </div>
            <button type="button">Çal</button>
          `;
          item.querySelector('button').addEventListener('click', () => {
            window.open(track.external_urls.spotify, '_blank');
          });
          trackList.appendChild(item);
        });
      }

      async function initialize() {
        const hash = getHashParams();
        if (hash.access_token) {
          saveToken(hash.access_token);
          window.location.hash = '';
        }

        const token = getToken();
        if (!token) {
          statusText.textContent = 'Spotify hesabınızla bağlanmak için Bağlan butonuna tıklayın.';
          return;
        }

        try {
          const profile = await fetchSpotify('me');
          statusText.textContent = `Hoş geldin, ${profile.display_name || profile.id}! En sevilen parçalarınızı getiriyorum...`;
          const topTracks = await fetchSpotify('me/top/tracks?limit=8');
          renderTracks(topTracks.items);
        } catch (error) {
          statusText.textContent = 'Spotify bağlantısı başarısız oldu. Tekrar bağlanmayı deneyin.';
          clearToken();
          console.error(error);
        }
      }

      connectBtn.addEventListener('click', () => {
        if (CLIENT_ID === 'REPLACE_WITH_YOUR_SPOTIFY_CLIENT_ID') {
          alert('Lütfen Spotify client ID girin.');
          return;
        }
        window.location.href = buildAuthUrl();
      });

      logoutBtn.addEventListener('click', () => {
        clearToken();
        trackList.innerHTML = '';
        statusText.textContent = 'Spotify bağlantısı temizlendi.';
      });

      window.addEventListener('load', initialize);
    </script>
  </body>
</html>
