<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notlar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=Germania+One&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../apps.css" />
    <link rel="stylesheet" href="../notes/notes.css" />
  </head>
  <body>
    <div class="bg-fx" aria-hidden="true">
      <div class="bg-blob blob-1"></div>
      <div class="bg-blob blob-2"></div>
      <div class="bg-blob blob-3"></div>
      <div class="bg-blob blob-4"></div>
      <div class="bg-grid"></div>
    </div>
    <a href="../../../bros.html" class="back-button">BrOS</a>
    <div class="placeholder-shell notes-shell">
      <div class="notes-header">
        <div>
          <p class="placeholder-subtitle">Notlar uygulamanız</p>
          <h1>Notes</h1>
          <p class="placeholder-description">
            Hemen not al, değişiklikleri otomatik kaydet ve notlarını ara.
          </p>
        </div>
        <button id="new-note-btn" class="add-note-btn">
          <span class="plus-icon">+</span>
        
        </button>
      </div>
      <div class="notes-actions">
        <input id="search-input" type="search" placeholder="Notları ara..." aria-label="Notları ara" />
      </div>
      <div id="notes-list" class="notes-list"></div>
      <p id="notes-empty" class="notes-empty" hidden>Henüz not yok. Yeni bir not ekleyin.</p>
    </div>
    <script src="../notes/notes.js"></script>
  </body>
</html>
