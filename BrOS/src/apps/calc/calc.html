<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calc</title>
    <link rel="stylesheet" href="calc.css" />
  </head>
  <body>
    <section id="calc-window" class="window" data-open="true" aria-label="Calculator Window">
      <div id="calc-header" class="window-header">
        <span>Calc</span>
        <button id="calc-toggle-btn" class="window-toggle-btn" type="button" aria-label="Toggle calculator">−</button>
      </div>
      <div class="window-body">
        <input id="calc-display" class="calc-display" type="text" value="0" readonly />
        <div class="calc-keys" role="grid" aria-label="Calculator keypad">
          <button type="button" data-action="clear">C</button>
          <button type="button" data-action="delete">⌫</button>
          <button type="button" data-value="%">%</button>
          <button type="button" data-value="/">÷</button>
          <button type="button" data-value="7">7</button>
          <button type="button" data-value="8">8</button>
          <button type="button" data-value="9">9</button>
          <button type="button" data-value="*">×</button>
          <button type="button" data-value="4">4</button>
          <button type="button" data-value="5">5</button>
          <button type="button" data-value="6">6</button>
          <button type="button" data-value="-">−</button>
          <button type="button" data-value="1">1</button>
          <button type="button" data-value="2">2</button>
          <button type="button" data-value="3">3</button>
          <button type="button" data-value="+">+</button>
          <button type="button" class="calc-zero" data-value="0">0</button>
          <button type="button" data-value=".">.</button>
          <button type="button" class="calc-equals" data-action="equals">=</button>
        </div>
      </div>
    </section>

    <script src="calc.js"></script>
  </body>
</html>
