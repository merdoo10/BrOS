<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=Germania+One&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../ai/ai.css" />
  </head>
  <body>
    <div class="bg-fx" aria-hidden="true">
      <div class="bg-blob blob-1"></div>
      <div class="bg-blob blob-2"></div>
      <div class="bg-blob blob-3"></div>
      <div class="bg-blob blob-4"></div>
      <div class="bg-grid"></div>
    </div>
    <a href="../../../bros.html" class="back-button">BrOS</a>

    <div class="ai-toolbar">
      <button id="ai-clear" class="ai-tool-btn" type="button" title="Sohbeti temizle">Sohbeti temizle</button>
    </div>

    <main class="ai-shell">
      <div id="ai-chat-log" class="ai-chat-log" aria-live="polite">
        <div class="ai-empty" id="ai-empty">
          <span class="ai-empty-icon">Jabbar</span>
          <h2>Merhaba!</h2>
          <p>chill guy.</p>
        </div>
      </div>

      <button id="ai-scroll-bottom" class="ai-scroll-btn" type="button" aria-label="En alta git">↓</button>

      <form id="ai-form" class="ai-input-row" autocomplete="off">
        <textarea
          id="ai-input"
          class="ai-input"
          placeholder="Mesajınızı yazın…  (Enter gönderir, Shift+Enter yeni satır)"
          rows="1"
          autofocus
        ></textarea>
        <button class="ai-send" type="submit">Gönder</button>
      </form>
    </main>

    <script src="bot.js"></script>

    <script src="bot.js"></script>

    <script>

      const STORAGE_KEY = 'ai-chat-history-v1';
      const chatLogEl   = document.getElementById('ai-chat-log');
      const emptyEl     = document.getElementById('ai-empty');
      const formEl      = document.getElementById('ai-form');
      const inputEl     = document.getElementById('ai-input');
      const sendBtn     = formEl.querySelector('.ai-send');
      const clearBtn    = document.getElementById('ai-clear');
      const scrollBtn   = document.getElementById('ai-scroll-bottom');

      const history = loadHistory();
      let requestInFlight = false;

      

      function loadHistory() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          return [];
        }
      }

      function persistHistory() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        } catch (e) {
        
        }
      }

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

    
      function renderMarkdown(text) {
        const safe = escapeHtml(text);
       
        return safe
          .replace(/```([\s\S]*?)```/g, (_, code) => `<pre>${code}</pre>`)
          .replace(/`([^`\n]+)`/g,        (_, code) => `<code>${code}</code>`)
          .replace(/\*\*([^*]+)\*\*/g,    (_, x) => `<strong>${x}</strong>`)
          .replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g, (_, lead, x) => `${lead}<em>${x}</em>`)
          .replace(/\n/g, '<br>');
      }

      function autoSizeInput() {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
      }

      function isAtBottom() {
        return chatLogEl.scrollHeight - chatLogEl.scrollTop - chatLogEl.clientHeight < 80;
      }

      function scrollToBottom() {
        chatLogEl.scrollTo({ top: chatLogEl.scrollHeight, behavior: 'smooth' });
      }

      function updateScrollButton() {
        scrollBtn.classList.toggle('visible', !isAtBottom() && history.length > 0);
      }

      function renderInitial() {

        chatLogEl.querySelectorAll('.ai-msg, .ai-meta').forEach(el => el.remove());
        if (history.length === 0) {
          emptyEl.style.display = 'block';
        } else {
          emptyEl.style.display = 'none';
          history.forEach((msg) => appendMessageNode(msg.role, msg.text, false));
          
          chatLogEl.scrollTop = chatLogEl.scrollHeight;
        }
      }

      function appendMessageNode(role, text, scroll = true) {
        const wrap = document.createElement('div');
        wrap.className = `ai-msg ${role}`;

        const bubble = document.createElement('div');
        bubble.className = 'ai-bubble';
        bubble.innerHTML = renderMarkdown(text);
        wrap.appendChild(bubble);

        const meta = document.createElement('div');
        meta.className = 'ai-meta';
        meta.textContent = role === 'user' ? 'sen' : 'asistan';
        wrap.appendChild(meta);

        chatLogEl.appendChild(wrap);
        if (scroll) scrollToBottom();
        updateScrollButton();
        return wrap;
      }

      function appendThinkingNode() {
        const wrap = document.createElement('div');
        wrap.className = 'ai-msg bot thinking';
        const bubble = document.createElement('div');
        bubble.className = 'ai-bubble';
        bubble.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
        wrap.appendChild(bubble);
        chatLogEl.appendChild(wrap);
        scrollToBottom();
        return wrap;
      }


      async function handleSubmit(event) {
        event.preventDefault();
        if (requestInFlight) return;

        const text = inputEl.value.trim();
        if (!text) return;

        requestInFlight = true;
        sendBtn.disabled = true;
        emptyEl.style.display = 'none';

        history.push({ role: 'user', text });
        persistHistory();
        appendMessageNode('user', text);

        inputEl.value = '';
        autoSizeInput();

        const thinkingNode = appendThinkingNode();

        let botText;
        try {
          if (window.aiBot && typeof window.aiBot.respond === 'function') {
            botText = await window.aiBot.respond(text, history.slice(0, -1));
            if (typeof botText !== 'string') botText = String(botText ?? '');
          } else {
            botText =
              '⚠️ Bot henüz bağlanmadı.\n\n' +
              'Bir bot eklemek için şu kalıbı kullanın:\n\n' +
              '```js\n' +
              'window.aiBot = {\n' +
              '  async respond(text, history) {\n' +
              '    // kendi mantığınız\n' +
              '    return "Cevabım";\n' +
              '  }\n' +
              '};\n' +
              '```';
          }
        } catch (error) {
          botText = `❌ Bot hata verdi: ${error && error.message ? error.message : error}`;
        } finally {
          thinkingNode.classList.remove('thinking');
          const bubble = thinkingNode.querySelector('.ai-bubble');
          bubble.innerHTML = renderMarkdown(botText || '_(boş yanıt)_');
          history.push({ role: 'bot', text: botText || '' });
          persistHistory();
          requestInFlight = false;
          sendBtn.disabled = false;
          inputEl.focus();
          scrollToBottom();
        }
      }

      

      inputEl.addEventListener('input', autoSizeInput);
      inputEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          formEl.requestSubmit();
        }
      });
      formEl.addEventListener('submit', handleSubmit);

      chatLogEl.addEventListener('scroll', updateScrollButton, { passive: true });
      scrollBtn.addEventListener('click', scrollToBottom);

      clearBtn.addEventListener('click', () => {
        const ok = window.confirm('Sohbeti temizlemek istediğinize emin misiniz?');
        if (!ok) return;
        history.length = 0;
        persistHistory();
        renderInitial();
        updateScrollButton();
      });

      renderInitial();
      autoSizeInput();
    </script>

   
      </script>
    
  </body>
</html>
