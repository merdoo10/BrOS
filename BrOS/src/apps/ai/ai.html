<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=Germania+One&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../apps.css" />
    <style>
      /* ========== Chatbox shell ========== */
      html, body { height: 100%; }
      body { overflow: hidden; }

      .ai-shell {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        max-width: 760px;
        margin: 0 auto;
        padding: 56px 16px 0;
        box-sizing: border-box;
      }

      .ai-chat-log {
        flex: 1 1 auto;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 12px 0 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        scroll-behavior: smooth;
        /* Subtle fade at top so very long histories still show the boundary */
        mask-image: linear-gradient(to bottom, transparent 0, #000 14px);
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14px);
      }

      .ai-msg {
        display: flex;
        width: 100%;
        animation: msgIn 0.22s ease-out;
      }
      .ai-msg.user { justify-content: flex-end; }
      .ai-msg.bot  { justify-content: flex-start; }
      @keyframes msgIn {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .ai-bubble {
        max-width: 88%;
        padding: 11px 15px;
        border-radius: 16px;
        line-height: 1.55;
        font-size: 15px;
        word-wrap: break-word;
      }
      .ai-msg.user .ai-bubble {
        background: linear-gradient(135deg,
          rgba(255, 163, 26, 0.28),
          rgba(226, 27, 218, 0.24));
        border: 1px solid rgba(255, 163, 26, 0.5);
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .ai-msg.bot .ai-bubble {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #e6e1f0;
        border-bottom-left-radius: 4px;
      }

      .ai-msg.thinking .ai-bubble {
        opacity: 0.7;
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      .ai-msg.thinking .dot {
        width: 6px;
        height: 6px;
        background: #cfcbe0;
        border-radius: 50%;
        display: inline-block;
        animation: bounce 1.2s infinite ease-in-out;
      }
      .ai-msg.thinking .dot:nth-child(2) { animation-delay: 0.15s; }
      .ai-msg.thinking .dot:nth-child(3) { animation-delay: 0.3s; }
      @keyframes bounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
        40%           { transform: translateY(-4px); opacity: 1; }
      }

      .ai-bubble p        { margin: 0 0 8px; }
      .ai-bubble p:last-child { margin: 0; }
      .ai-bubble pre {
        background: rgba(0, 0, 0, 0.35);
        padding: 8px 12px;
        border-radius: 8px;
        overflow-x: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        margin: 8px 0;
      }
      .ai-bubble code {
        background: rgba(0, 0, 0, 0.3);
        padding: 1px 6px;
        border-radius: 4px;
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }
      .ai-bubble strong { font-weight: 600; color: #ffe81a; }
      .ai-bubble em     { font-style: italic; color: #ffa31a; }

      .ai-meta {
        font-size: 11px;
        color: rgba(207, 203, 224, 0.55);
        margin: 2px 4px 0;
        font-family: Geist Pixel;
        letter-spacing: 0.04em;
      }
      .ai-msg.user .ai-meta { text-align: right; align-self: flex-end; margin-right: 4px; }
      .ai-msg.bot  .ai-meta { text-align: left;  align-self: flex-start; margin-left: 4px; }

      /* ========== Empty state ========== */
      .ai-empty {
        text-align: center;
        margin: 14vh auto 0;
        color: #cfcbe0;
        font-family: Quicksand;
        padding: 0 12px;
      }
      .ai-empty .ai-empty-icon {
        font-size: 56px;
        line-height: 1;
        display: inline-block;
        filter: drop-shadow(0 0 24px rgba(226, 27, 218, 0.55))
                drop-shadow(0 0 12px rgba(26, 35, 255, 0.45));
        animation: iconPulse 2.4s ease-in-out infinite;
      }
      @keyframes iconPulse {
        0%, 100% { transform: scale(1) rotate(-2deg); }
        50%      { transform: scale(1.1) rotate(2deg); }
      }
      .ai-empty h2 {
        font-family: Germania One;
        color: #fff;
        font-size: 28px;
        margin: 14px 0 6px;
        letter-spacing: 0.04em;
        text-shadow: 0 0 18px rgba(255, 163, 26, 0.45);
      }
      .ai-empty p {
        max-width: 480px;
        margin: 0 auto 4px;
        line-height: 1.6;
        font-size: 15px;
      }
      .ai-empty code {
        background: rgba(0, 0, 0, 0.3);
        padding: 1px 6px;
        border-radius: 4px;
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }

      /* ========== Input row ========== */
      .ai-input-row {
        display: flex;
        gap: 8px;
        align-items: flex-end;
        padding: 10px 4px 18px;
        background: linear-gradient(to top,
          rgba(10, 9, 16, 0.85) 60%,
          rgba(10, 9, 16, 0));
      }
      .ai-input {
        flex: 1;
        min-width: 0;
        padding: 11px 16px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 22px;
        color: #fff;
        font-family: Quicksand, sans-serif;
        font-size: 15px;
        line-height: 1.4;
        resize: none;
        max-height: 160px;
        outline: none;
        transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      }
      .ai-input::placeholder { color: rgba(207, 203, 224, 0.5); }
      .ai-input:focus {
        border-color: rgba(255, 163, 26, 0.7);
        background: rgba(255, 255, 255, 0.11);
        box-shadow: 0 0 0 3px rgba(255, 163, 26, 0.18);
      }
      .ai-send {
        flex: 0 0 auto;
        padding: 11px 22px;
        background: linear-gradient(135deg, #ffa31a, #e21bda);
        border: 0;
        border-radius: 22px;
        color: #0a0910;
        font-family: Germania One;
        font-size: 14px;
        letter-spacing: 0.06em;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
        box-shadow: 0 6px 16px rgba(255, 163, 26, 0.35);
      }
      .ai-send:hover:not(:disabled) {
        transform: translateY(-1px) scale(1.04);
        box-shadow: 0 10px 24px rgba(226, 27, 218, 0.45);
      }
      .ai-send:active:not(:disabled) { transform: translateY(0) scale(0.98); }
      .ai-send:disabled { opacity: 0.45; cursor: not-allowed; }

      /* ========== Toolbar (clear button + scroll-to-bottom floater) ========== */
      .ai-toolbar {
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 5;
        display: flex;
        gap: 6px;
      }
      .ai-tool-btn {
        padding: 7px 12px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        color: #cfcbe0;
        font-family: Geist Pixel;
        font-size: 11px;
        letter-spacing: 0.06em;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .ai-tool-btn:hover { background: rgba(255, 80, 80, 0.18); color: #ffd0d0; }

      .ai-scroll-btn {
        position: absolute;
        right: 14px;
        bottom: 88px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 0.18s ease, transform 0.18s ease, background 0.15s ease;
        pointer-events: none;
        z-index: 4;
      }
      .ai-scroll-btn.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
      .ai-scroll-btn:hover { background: rgba(255, 255, 255, 0.2); }

      /* Mobile-ish narrow window: shrink input padding */
      @media (max-width: 480px) {
        .ai-shell { padding: 48px 8px 0; }
        .ai-bubble { max-width: 95%; }
        .ai-empty h2 { font-size: 22px; }
      }
    </style>
  </head>
  <body>
    <div class="bg-fx" aria-hidden="true">
      <div class="bg-blob blob-1"></div>
      <div class="bg-blob blob-2"></div>
      <div class="bg-blob blob-3"></div>
      <div class="bg-blob blob-4"></div>
      <div class="bg-grid"></div>
    </div>
    <a href="../../../bros.html" class="back-button">BrOS</a>

    <div class="ai-toolbar">
      <button id="ai-clear" class="ai-tool-btn" type="button" title="Sohbeti temizle">Sohbeti temizle</button>
    </div>

    <main class="ai-shell">
      <div id="ai-chat-log" class="ai-chat-log" aria-live="polite">
        <div class="ai-empty" id="ai-empty">
          <span class="ai-empty-icon">🤖</span>
          <h2>Merhaba!</h2>
          <p>Yerleşik BrOS asistanı. Sorularınızı yazın — botunuz cevap verecek.</p>
          <p>İpucu: botu <code>window.aiBot.respond</code> içine bağlayın.</p>
        </div>
      </div>

      <button id="ai-scroll-bottom" class="ai-scroll-btn" type="button" aria-label="En alta git">↓</button>

      <form id="ai-form" class="ai-input-row" autocomplete="off">
        <textarea
          id="ai-input"
          class="ai-input"
          placeholder="Mesajınızı yazın…  (Enter gönderir, Shift+Enter yeni satır)"
          rows="1"
          autofocus
        ></textarea>
        <button class="ai-send" type="submit">Gönder</button>
      </form>
    </main>

    <script src="bot.js"></script>

    <script src="bot.js"></script>

    <script>
      /* ============================================================
       * BrOS AI Chatbox — UI shell
       * ------------------------------------------------------------
       * The bot LOGIC is intentionally NOT included here.
       *
       * Wire up your own bot by setting:
       *
       *   window.aiBot = {
       *     async respond(text, history) {
       *       // text    : the latest user message (string)
       *       // history : Array<{ role: 'user' | 'bot', text: string }>
       *       // return  : a string (plain text or markdown-lite)
       *     }
       *   };
       *
       * You can do this inline in this file (at the very bottom of
       * this <script>, after the shell boots) or by serving a second
       * JS file and loading it before this page.
       *
       * If no bot is attached yet, the UI shows a friendly error
       * bubble explaining what to do — so it's safe to ship as-is.
       * ============================================================ */

      const STORAGE_KEY = 'ai-chat-history-v1';
      const chatLogEl   = document.getElementById('ai-chat-log');
      const emptyEl     = document.getElementById('ai-empty');
      const formEl      = document.getElementById('ai-form');
      const inputEl     = document.getElementById('ai-input');
      const sendBtn     = formEl.querySelector('.ai-send');
      const clearBtn    = document.getElementById('ai-clear');
      const scrollBtn   = document.getElementById('ai-scroll-bottom');

      const history = loadHistory();
      let requestInFlight = false;

      /* ---------- helpers ---------- */

      function loadHistory() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          return [];
        }
      }

      function persistHistory() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        } catch (e) {
          /* localStorage quota or private mode — silent ignore. */
        }
      }

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      // Tiny markdown renderer — keeps the deps zero. Replace with a
      // full library if you need more (e.g. headings, tables, links).
      function renderMarkdown(text) {
        const safe = escapeHtml(text);
        // Code fences first (so ``` inside <pre> isn't later mangled).
        return safe
          .replace(/```([\s\S]*?)```/g, (_, code) => `<pre>${code}</pre>`)
          .replace(/`([^`\n]+)`/g,        (_, code) => `<code>${code}</code>`)
          .replace(/\*\*([^*]+)\*\*/g,    (_, x) => `<strong>${x}</strong>`)
          .replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g, (_, lead, x) => `${lead}<em>${x}</em>`)
          .replace(/\n/g, '<br>');
      }

      function autoSizeInput() {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
      }

      function isAtBottom() {
        return chatLogEl.scrollHeight - chatLogEl.scrollTop - chatLogEl.clientHeight < 80;
      }

      function scrollToBottom() {
        chatLogEl.scrollTo({ top: chatLogEl.scrollHeight, behavior: 'smooth' });
      }

      function updateScrollButton() {
        scrollBtn.classList.toggle('visible', !isAtBottom() && history.length > 0);
      }

      function renderInitial() {
        // Strip previous message nodes (everything except the empty placeholder).
        chatLogEl.querySelectorAll('.ai-msg, .ai-meta').forEach(el => el.remove());
        if (history.length === 0) {
          emptyEl.style.display = 'block';
        } else {
          emptyEl.style.display = 'none';
          history.forEach((msg) => appendMessageNode(msg.role, msg.text, false));
          // Pin to bottom on initial load so newest message is visible.
          chatLogEl.scrollTop = chatLogEl.scrollHeight;
        }
      }

      function appendMessageNode(role, text, scroll = true) {
        const wrap = document.createElement('div');
        wrap.className = `ai-msg ${role}`;

        const bubble = document.createElement('div');
        bubble.className = 'ai-bubble';
        bubble.innerHTML = renderMarkdown(text);
        wrap.appendChild(bubble);

        const meta = document.createElement('div');
        meta.className = 'ai-meta';
        meta.textContent = role === 'user' ? 'sen' : 'asistan';
        wrap.appendChild(meta);

        chatLogEl.appendChild(wrap);
        if (scroll) scrollToBottom();
        updateScrollButton();
        return wrap;
      }

      function appendThinkingNode() {
        const wrap = document.createElement('div');
        wrap.className = 'ai-msg bot thinking';
        const bubble = document.createElement('div');
        bubble.className = 'ai-bubble';
        bubble.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
        wrap.appendChild(bubble);
        chatLogEl.appendChild(wrap);
        scrollToBottom();
        return wrap;
      }

      /* ---------- submit (user → bot) ---------- */

      async function handleSubmit(event) {
        event.preventDefault();
        if (requestInFlight) return;

        const text = inputEl.value.trim();
        if (!text) return;

        requestInFlight = true;
        sendBtn.disabled = true;
        emptyEl.style.display = 'none';

        history.push({ role: 'user', text });
        persistHistory();
        appendMessageNode('user', text);

        inputEl.value = '';
        autoSizeInput();

        const thinkingNode = appendThinkingNode();

        let botText;
        try {
          if (window.aiBot && typeof window.aiBot.respond === 'function') {
            botText = await window.aiBot.respond(text, history.slice(0, -1));
            if (typeof botText !== 'string') botText = String(botText ?? '');
          } else {
            botText =
              '⚠️ Bot henüz bağlanmadı.\n\n' +
              'Bir bot eklemek için şu kalıbı kullanın:\n\n' +
              '```js\n' +
              'window.aiBot = {\n' +
              '  async respond(text, history) {\n' +
              '    // kendi mantığınız\n' +
              '    return "Cevabım";\n' +
              '  }\n' +
              '};\n' +
              '```';
          }
        } catch (error) {
          botText = `❌ Bot hata verdi: ${error && error.message ? error.message : error}`;
        } finally {
          thinkingNode.classList.remove('thinking');
          const bubble = thinkingNode.querySelector('.ai-bubble');
          bubble.innerHTML = renderMarkdown(botText || '_(boş yanıt)_');
          history.push({ role: 'bot', text: botText || '' });
          persistHistory();
          requestInFlight = false;
          sendBtn.disabled = false;
          inputEl.focus();
          scrollToBottom();
        }
      }

      /* ---------- wire up events ---------- */

      inputEl.addEventListener('input', autoSizeInput);
      inputEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          formEl.requestSubmit();
        }
      });
      formEl.addEventListener('submit', handleSubmit);

      chatLogEl.addEventListener('scroll', updateScrollButton, { passive: true });
      scrollBtn.addEventListener('click', scrollToBottom);

      clearBtn.addEventListener('click', () => {
        const ok = window.confirm('Sohbeti temizlemek istediğinize emin misiniz?');
        if (!ok) return;
        history.length = 0;
        persistHistory();
        renderInitial();
        updateScrollButton();
      });

      /* ---------- boot ---------- */
      renderInitial();
      autoSizeInput();
    </script>

    <!--
      ============================================================
      ÖRNEK BOT (çalışır halde) — kendi bot mantığınızla değiştirin
      ============================================================
      Bu bloğu açıp / yorumdan çıkarabilirsiniz. Test amaçlıdır:

      <script>
        window.aiBot = {
          async respond(text, history) {
            const echo = (Math.random() < 0.5) ? 'Anladım: ' : 'Hmm, ';
            return echo + text + '\n\n(Kendi bot mantığınızı yazın — örn. bir LLM API, yerel arama, komut çalıştırma, vs.)';
          }
        };
      </script>
    -->
  </body>
</html>
