<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HM</title>
    <link rel="stylesheet" href="../apps.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #140f1f, #2b1740);
        color: #f7f2ff;
        font-family: Arial, sans-serif;
      }
      .hm-page {
        max-width: 780px;
        margin: 0 auto;
        padding: 32px 20px 48px;
        display: grid;
        gap: 18px;
      }
      .hm-card {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 22px;
        padding: 24px;
      }
      .hm-card h1 {
        margin: 0 0 10px;
        font-size: 2rem;
      }
      .hm-card p {
        margin: 0;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="hm-page">
      <div class="hm-card">
        <h1>Calc</h1>
      </div>
    </div>
  </body>
</html>
