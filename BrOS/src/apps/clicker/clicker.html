<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clicker</title>
    <link rel="stylesheet" href="clicker.css" />
  </head>
  <body>
    <div class="click-shell">
      <div class="click-card">
        <div class="click-header">
          <h1>Cookie Clicker</h1>
          <div class="click-score">Cookies: <span id="coins-count">0</span></div>
        </div>

        <div class="click-stats">
          <div class="stat-card">
            <span>Click Power</span>
            <strong id="click-power">1</strong>
          </div>
          <div class="stat-card">
            <span>Auto Clickers</span>
            <strong id="idle-rate">0</strong>
          </div>
        </div>

        <div class="cookie-stage">
          <div class="cookie-orbit"></div>
          <button id="click-button" class="cookie-button" aria-label="Cookie">🍪</button>
        </div>

        <div class="upgrades">
          <div class="upgrade-item">
            <span>Auto Clicker</span>
            <button id="buy-auto">Buy (20)</button>
          </div>
          <div class="upgrade-item">
            <span>Click Power</span>
            <button id="buy-power">Buy (50)</button>
          </div>
          <div class="upgrade-item">
            <span>Reset</span>
            <button id="reset-button">Reset</button>
          </div>
        </div>
      </div>
    </div>

    <script src="clicker.js"></script>
  </body>
</html>
